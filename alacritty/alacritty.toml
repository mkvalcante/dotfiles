# Added by Gogh
general.import = ["~/.config/alacritty/gogh.toml"]

[window]
dimensions = { columns = 100, lines = 30 }
padding = { x = 4, y = 4 }
dynamic_padding = true
opacity = 0.8
blur = true

[font]
normal = { family = "IosevkaTerm Nerd Font Mono", style = "Regular" }
bold = { family = "IosevkaTerm Nerd Font Mono", style = "Bold" }
italic = { family = "IosevkaTerm Nerd Font Mono", style = "Italic" }
bold_italic = { family = "IosevkaTerm Nerd Font Mono", style = "Bold Italic" }
size = 12.0

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "Off" }
